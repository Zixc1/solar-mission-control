cd ~/solar-mission-control

cat > .github/workflows/space-weather-report.yml <<'YAML'
name: Generate and Publish Space Weather Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  generate-report:
    name: Generate report
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Pull Solar Mission Control image
        run: docker pull zixc1/solar-mission-control:latest

      - name: Generate full report
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env NASA_API_KEY \
            --env HOME=/tmp \
            --env MPLCONFIGDIR=/tmp/matplotlib \
            --volume "$GITHUB_WORKSPACE/output:/output" \
            zixc1/solar-mission-control:latest \
            --output-dir /output

      - name: Verify generated report
        run: |
          echo "Generated report contents:"
          find "$GITHUB_WORKSPACE/output" -maxdepth 3 -type f -print | sort
          test -s "$GITHUB_WORKSPACE/output/space_weather_report.html"
          test -s "$GITHUB_WORKSPACE/output/space_weather_report.txt"

      - name: Prepare website
        run: |
          cp "$GITHUB_WORKSPACE/output/space_weather_report.html" \
             "$GITHUB_WORKSPACE/output/index.html"
          touch "$GITHUB_WORKSPACE/output/.nojekyll"
          find "$GITHUB_WORKSPACE/output" -maxdepth 3 -type f -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

      - name: Upload downloadable report
        uses: actions/upload-artifact@v4
        with:
          name: space-weather-report
          path: output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-24.04
    needs: generate-report

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
YAML
