name: Generate and Publish Space Weather Report

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  generate-report:
    runs-on: ubuntu-24.04

    steps:
      - name: Create output directory
        run: mkdir -p output

      - name: Pull Solar Mission Control image
        run: docker pull zixc1/solar-mission-control:latest

      - name: Generate full report
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env NASA_API_KEY \
            --env HOME=/tmp \
            --env MPLCONFIGDIR=/tmp/matplotlib \
            -v "$PWD/output:/app/swrl_report" \
            zixc1/solar-mission-control:latest

      - name: Prepare website
        run: |
          test -f output/space_weather_report.html
          cp output/space_weather_report.html output/index.html
          touch output/.nojekyll

          echo "Website contents:"
          find output -maxdepth 3 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

      - name: Upload downloadable report
        uses: actions/upload-artifact@v4
        with:
          name: space-weather-report
          path: output/
          if-no-files-found: error
          retention-days: 14

  deploy:
    runs-on: ubuntu-24.04
    needs: generate-report

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/
